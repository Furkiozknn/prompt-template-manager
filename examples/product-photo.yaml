# Example template: a parameterized product-photography prompt.
#
# Try it:
#   ptm render examples/product-photo.yaml --var product_name="a red sneaker" --pretty
#   ptm render examples/product-photo.yaml --var product_name="a red sneaker" --var background_color=black --pretty

name: product-photo-on-solid-background
version: "1"
capability: mock-generate
description: >
  A studio product photo on a solid background. `product_name` is required;
  everything else has a sensible default.

variables:
  product_name:
    type: string
    required: true
    description: What the photo is of, e.g. "a red sneaker"
  background_color:
    type: string
    default: white
    description: Backdrop color
  width:
    type: integer
    default: 1024
  height:
    type: integer
    default: 1024
  seed:
    type: integer
    default: 0

params:
  prompt: "professional studio product photo of {{ product_name }}, on a seamless {{ background_color }} background, soft even lighting, high detail, centered composition"
  width: "${width}"
  height: "${height}"
  seed: "${seed}"

# Run with: ptm test examples/product-photo.yaml
tests:
  - name: defaults give a square white-background photo
    vars: {product_name: "a red sneaker"}
    expect: {width: 1024, height: 1024, seed: 0}
    contains:
      prompt: ["a red sneaker", "seamless white background"]
  - name: a custom background and size keep their types
    vars: {product_name: "a mug", background_color: black, width: "1536"}
    expect: {width: 1536}
    contains: {prompt: "seamless black background"}
    not_contains: {prompt: "white"}
  - name: the product name is required
    vars: {}
    error: "missing required variable(s): 'product_name'"
