<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="prompt-template-manager - your prompts deserve git diff, not a database row">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161230"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="50%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#39d3bb"/>
    </linearGradient>
    <linearGradient id="markAccent" gradientUnits="userSpaceOnUse" x1="72" y1="108" x2="146" y2="190">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="60%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#39d3bb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g>
    <rect x="808" y="70" width="352" height="182" rx="10" fill="#141026" stroke="#3c3168" stroke-width="1.6"/>
    <rect x="808" y="70" width="352" height="30" rx="10" fill="#1c1636"/>
    <rect x="808" y="92" width="352" height="8" fill="#1c1636"/>
    <text x="824" y="90" font-family="ui-monospace, monospace" font-size="13" fill="#b394f7">prompts/hero.v3.yaml</text>
    <g font-family="ui-monospace, monospace" font-size="12.5">
      <rect x="808" y="112" width="352" height="20" fill="#123021" opacity="0.75"/>
      <text x="822" y="126" fill="#5fd977">+ tone: cinematic, restrained</text>
      <text x="822" y="150" fill="#8b98a9">  subject: "{{ subject }}"</text>
      <rect x="808" y="158" width="352" height="20" fill="#3a1620" opacity="0.7"/>
      <text x="822" y="172" fill="#f2777a">- steps: 40</text>
      <rect x="808" y="180" width="352" height="20" fill="#123021" opacity="0.75"/>
      <text x="822" y="194" fill="#5fd977">+ steps: ${steps}</text>
      <text x="822" y="218" fill="#8b98a9">  guard: StrictUndefined</text>
    </g>
  </g>

  <g transform="translate(72,108)" fill="none" stroke="url(#markAccent)" stroke-width="7" stroke-linecap="round">
    <path d="M14 14 L14 66"/>
    <circle cx="14" cy="14" r="9"/>
    <circle cx="14" cy="66" r="9"/>
    <circle cx="66" cy="40" r="9"/>
    <path d="M23 40 L57 40"/>
  </g>

  <text x="176" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#e6edf3">prompt-template-manager</text>
  <text x="178" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b98a9">Your prompts deserve <tspan font-family='ui-monospace, monospace'>git diff</tspan>, not a database row.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(178,204)">
      <rect width="161" height="34" rx="17" fill="#1c1730" stroke="#4a3b7a"/>
      <text x="80" y="22" text-anchor="middle" fill="#b394f7">reviewable in a PR</text>
    </g>
    <g transform="translate(353,204)">
      <rect width="214" height="34" rx="17" fill="#0f2130" stroke="#1f4f7a"/>
      <text x="107" y="22" text-anchor="middle" fill="#6cb6ff">StrictUndefined by default</text>
    </g>
    <g transform="translate(581,204)">
      <rect width="177" height="34" rx="17" fill="#0f2a24" stroke="#1f6f5c"/>
      <text x="88" y="22" text-anchor="middle" fill="#56d4b4">type-preserving vars</text>
    </g>
  </g>

  <text x="178" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5c6b7f">150 tests &#183; sandboxed Jinja2 &#183; CLI: ptm &#183; MIT</text>
</svg>
