name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject'teki siniflandiricilarin iddia ettigi her surum.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest -v

      # README'deki komutlar gercekten calisiyor mu -- kurulan `ptm` betigiyle.
      - name: CLI smoke
        run: |
          set -eu
          uv run ptm --version
          uv run ptm validate examples/*.yaml
          uv run ptm info examples/product-photo.yaml
          uv run ptm render examples/product-photo.yaml --var product_name="a red sneaker" --pretty

  # yayinla.yml ile ayni paketleme adimlari, ama her push'ta: paket
  # meta verisi bozulursa bunu etiket atildiginda degil, PR'da gormek icin.
  package:
    name: paketle (uv build + twine check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*

  vendor:
    name: gateway_poll.py kaynagiyla ayni mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bu dosya ai-job-gateway'den kopyalandi. Kopyalamak bilincli bir karar:
      # dort projeden hicbiri digerine bagimli olmak zorunda kalmiyor. Ama
      # kopyalar sessizce ayrisir -- birinde duzeltilen bir sinir durumu
      # digerlerinde durmaya devam eder ve her depo kendi kopyasina karsi
      # yesil kalir. Betik ag yoksa ATLIYOR, gecmiyor (cikis 2).
      - name: Kanonik kopyayla karsilastir
        run: |
          set -eu
          kod=0
          python3 arac/vendor-dogrula.py || kod=$?
          case "$kod" in
            0) echo "ayni" ;;
            2) echo "::warning::kanonik kopyaya bakilamadi; bu adim bir sey kanitlamadi" ;;
            *) exit "$kod" ;;
          esac
