[project]
name = "prompt-template-manager"
version = "0.1.0"
description = "Versioned, git-diffable prompt/pipeline templates for generative AI requests, with a strict renderer and CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Furkiozkann" },
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
ptm = "prompt_template_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_template_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
]
