[project]
name = "ptm-cli"
version = "0.1.0"
description = "Versioned, git-diffable prompt/pipeline templates for generative AI requests, with a strict renderer and CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Furkiozkann" },
]
keywords = [
    "prompt",
    "template",
    "yaml",
    "jinja2",
    "versioning",
    "generative-ai",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pyyaml>=6.0.3",
    "jinja2>=3.1",
    "httpx>=0.28.1",
]

[project.scripts]
ptm = "prompt_template_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_template_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
